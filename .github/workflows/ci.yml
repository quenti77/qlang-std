name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      QLANG_TEST_REDIS: redis://127.0.0.1:6379/9
    steps:
      - uses: actions/checkout@v4
      - name: Install qlang
        run: |
          curl -fsSL https://raw.githubusercontent.com/quenti77/qlang/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: qlang --version
      - run: qlang test
      - name: The API page is up to date
        run: |
          qlang doc -o /tmp/API.md
          diff -u API.md /tmp/API.md
